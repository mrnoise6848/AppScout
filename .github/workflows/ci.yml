name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, unit tests, assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # compileSdk 37 / build-tools are downloaded by AGP on demand; licences are pre-accepted
      # by android-actions/setup-android.

      - name: Lint
        run: ./gradlew --no-daemon lint

      - name: Unit tests
        run: ./gradlew --no-daemon test

      - name: Assemble debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/**
            app/build/test-results/**
